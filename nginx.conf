server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O WASM da remoção de fundo precisa do tipo certo para compilar no navegador.
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Arquivos com hash no nome nunca mudam.
    # Os cabeçalhos se repetem porque add_header num location anula os do servidor.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
